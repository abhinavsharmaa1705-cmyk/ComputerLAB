    <meta

      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Interactive AR PC</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #guide {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        padding: 8px 15px;
        border-radius: 10px;
        font-family: sans-serif;
        z-index: 999;
      }
.ar-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: radial-gradient(circle at 30% 30%, #3b82f6aa, transparent 40%),
              radial-gradient(circle at 70% 70%, #9333ea88, transparent 40%),
              #020617;
  animation: bgMove 8s infinite alternate ease-in-out;
  z-index: -1;
}
#backBtn {
  z-index: 9999;
  pointer-events: auto;
    position: fixed;
  top: 20px;
  left: 20px;
  padding: 10px 18px;
  font-size: 16px;
  background: #111;
  color: white;
  border: none;
  border-radius: 8px;
  display: none; 
  cursor: pointer;
}
#credit {
  position: fixed;
  bottom: 20px;
  left: 0;
  width: 100%;

  background: rgba(0, 0, 0, 0.6);
  color: #ffffff;
  display: none;
  padding: 6px 0;
  font-size: 14px;
  font-family: sans-serif;

  z-index: 9999;
  pointer-events: none;
}
@keyframes bgMove {
  0% { background-position: 30% 30%, 70% 70%; }
  100% { background-position: 40% 40%, 60% 60%; }
}

.ticker {
  white-space: nowrap;
  overflow: hidden;
  position: relative;
}

.ticker span {
  display: inline-block;
  padding-left: 100%;
  animation: scrollText 12s linear infinite;
}

@keyframes scrollText {
  0% {
    transform: translateX(0%);
  }
  100% {
    transform: translateX(-100%);
  }
}

<script>
AFRAME.registerComponent('gesture-control', {
  schema: {
    moveSpeed: { default: 0.005 },
    zoomSpeed: { default: 0.01 },

    // 🔥 LIMITS (adjust if needed)
    minX: { default: -1.2 },
    maxX: { default: 1.2 },
    minY: { default: -0.8 },
    maxY: { default: 1.2 },
    minZ: { default: -3 },
    maxZ: { default: -0.5 }
  },

  init: function () {
    this.isDragging = false;
    this.previous = { x: 0, y: 0 };
    this.initialDistance = null;

    const el = this.el;

    // 🖱️ MOUSE
    window.addEventListener('mousedown', (e) => {
      this.isDragging = true;
      this.previous = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => {
      this.isDragging = false;
    });

    window.addEventListener('mousemove', (e) => {
      if (!this.isDragging) return;

      const dx = e.clientX - this.previous.x;
      const dy = e.clientY - this.previous.y;

      let pos = el.getAttribute('position');

      // 🎯 MOVE
      pos.x += dx * this.data.moveSpeed;
      pos.y -= dy * this.data.moveSpeed;

      // 🛑 CLAMP (IMPORTANT)
      pos.x = Math.max(this.data.minX, Math.min(this.data.maxX, pos.x));
      pos.y = Math.max(this.data.minY, Math.min(this.data.maxY, pos.y));

      el.setAttribute('position', pos);

      this.previous = { x: e.clientX, y: e.clientY };
    });

    // 📱 TOUCH START
    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        this.isDragging = true;
        this.previous = {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY
        };
      }

      if (e.touches.length === 2) {
        this.initialDistance = this.getDistance(e.touches);
      }
    });

    // 📱 TOUCH MOVE
    window.addEventListener('touchmove', (e) => {
      let pos = el.getAttribute('position');

      // 👉 DRAG
      if (e.touches.length === 1 && this.isDragging) {
        const dx = e.touches[0].clientX - this.previous.x;
        const dy = e.touches[0].clientY - this.previous.y;

        pos.x += dx * this.data.moveSpeed;
        pos.y -= dy * this.data.moveSpeed;

        // 🛑 CLAMP
        pos.x = Math.max(this.data.minX, Math.min(this.data.maxX, pos.x));
        pos.y = Math.max(this.data.minY, Math.min(this.data.maxY, pos.y));

        el.setAttribute('position', pos);

        this.previous = {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY
        };
      }

      // 👉 ZOOM
      if (e.touches.length === 2) {
        const newDistance = this.getDistance(e.touches);

        if (this.initialDistance) {
          let diff = newDistance - this.initialDistance;

          pos.z += diff * this.data.zoomSpeed;

          // 🛑 CLAMP ZOOM
          pos.z = Math.max(this.data.minZ, Math.min(this.data.maxZ, pos.z));

          el.setAttribute('position', pos);
        }

        this.initialDistance = newDistance;
      }
    });

    window.addEventListener('touchend', () => {
      this.isDragging = false;
      this.initialDistance = null;
    });
  },

  getDistance: function (touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
});

AFRAME.registerComponent('circle-layout', {
  schema: {
    radius: { default: 1.5 }
  },

  init: function () {
    const children = this.el.children;
    const total = children.length;
    const radius = this.data.radius;

    for (let i = 0; i < total; i++) {
      const angle = (i / total) * Math.PI * 2;

      const x = radius * Math.cos(angle);
      const z = radius * Math.sin(angle);

      children[i].setAttribute('position', `${x} 0 ${z}`);
      children[i].setAttribute('look-at', '#camera');
    }
  }
});



</script>
